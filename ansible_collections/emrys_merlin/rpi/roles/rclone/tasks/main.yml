---
# tasks file for collections/ansible_collections/emrys_merlin/rpi/roles/rclone
- name: Create rclone data directory
  ansible.builtin.file:
    path: "{{ rclone_location }}"
    state: directory
    mode: '755'

- name: Check compose file
  ansible.builtin.stat:
    path: "{{ rclone_location }}/compose.yaml"
  register: compose_file

- name: Stop rclone container
  community.docker.docker_compose_v2:
    project_src: "{{ rclone_location }}"
    state: absent
  when: compose_file.stat.exists

- name: Create rclone data directory
  ansible.builtin.file:
    path: "{{ rclone_location }}/data"
    state: directory
    mode: '755'
    recurse: true

- name: Create rclone config directory
  ansible.builtin.file:
    path: "{{ rclone_location }}/rclone"
    state: directory
    mode: '755'

- name: Copy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ rclone_location }}/compose.yaml"
    mode: '644'

# Preferred path: the config arrives as a variable (e.g. a 1Password lookup), so
# no plaintext copy has to exist on the control node. `content` writes the bytes
# verbatim -- no template, so rclone's file format stays rclone's business.
- name: Write rclone config from variable
  ansible.builtin.copy:
    content: "{{ rclone_config_content }}"
    dest: "{{ rclone_location }}/rclone/rclone.conf"
    owner: "{{ rclone_uid }}"
    group: "{{ rclone_gid }}"
    mode: '600'
  no_log: true  # without this, --diff prints the OAuth tokens
  when: rclone_config_content is defined

# Legacy path: a plaintext rclone.conf in the role's files/ directory.
- name: Copy rclone config
  ansible.builtin.copy:
    src: "{{ rclone_config }}"
    dest: "{{ rclone_location }}/rclone/rclone.conf"
    owner: "{{ rclone_uid }}"
    group: "{{ rclone_gid }}"
    mode: '600'
  when: rclone_config_content is not defined

- name: Run rclone container
  community.docker.docker_compose_v2:
    project_src: "{{ rclone_location }}"
    state: present
    build: never
    pull: always
    remove_orphans: true
    recreate: always
  register: rclone_container

- name: Add to crontab
  ansible.builtin.cron:
    name: "{{ rclone_location }}"
    job: "cd {{ rclone_location }} && docker compose up"
    minute: "{{ rclone_cron_minute }}"
    hour: "{{ rclone_cron_hour }}"
    user: "{{ ansible_user_id }}"
    state: present
  when: rclone_cron_enable
