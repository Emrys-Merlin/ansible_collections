---
# defaults file for emrys_merlin.rpi.victoria_metrics

# Single-node Victoria Metrics deployment.
victoria_metrics_version: v1.147.0
victoria_metrics_location: "{{ docker_dir }}/victoria_metrics"
victoria_metrics_port: 8428
# Retention period, see https://docs.victoriametrics.com/#retention
# (a bare number is months; units h/d/w/y also work). "100y" keeps data
# effectively forever — VictoriaMetrics has no literal "infinite" setting.
victoria_metrics_retention: "100y"

# Home Assistant scrape (pull). Turn on once HA's `prometheus:` integration is
# enabled and a long-lived access token is available via victoria_metrics_ha_token.
victoria_metrics_scrape_homeassistant: false
victoria_metrics_scrape_interval: 60s
victoria_metrics_ha_scheme: http
victoria_metrics_ha_host: homeassistant.local
victoria_metrics_ha_port: 8123
# HA long-lived access token; set from a 1Password lookup in host/group vars.
victoria_metrics_ha_token: ""
# Only these metric names are stored; everything else HA exposes is dropped.
# Entries are **regexes** joined into one alternation (see scrape.yml.j2), not
# literals — plain names simply happen to be regexes matching themselves.
# NB `humidity_percent` is *air* humidity; soil moisture is a separate device
# class and lands in `moisture_percent`. `number_state_percent` is kept for the
# soil sensors' on-device `soil_moisture_offset` — without it a step in the
# moisture series is indistinguishable from someone changing the calibration.
# `pm25_.*` is deliberately loose: HA builds the metric name from the unit and
# encodes non-ASCII by codepoint, so µg/m³ renders as
# `homeassistant_sensor_pm25_u0xb5g_per_mu0xb3` today (µ=U+00B5, ³=U+00B3).
# Do not "tighten" this to `_ug_per_m3` — that matches nothing, silently.
victoria_metrics_ha_keep_metrics:
  - homeassistant_sensor_temperature_celsius
  - homeassistant_sensor_humidity_percent
  - homeassistant_sensor_moisture_percent
  - homeassistant_sensor_battery_percent
  - homeassistant_sensor_power_w
  - homeassistant_sensor_energy_kwh
  - homeassistant_sensor_carbon_dioxide_ppm
  - homeassistant_sensor_pm25_.*
  - homeassistant_number_state_percent

# Device-side freshness, kept only for the entities matched here.
#
# Why this exists: the scrape can never look stale. HA re-exports an entity's
# retained state on every scrape, so VictoriaMetrics stores a fresh sample every
# 60s even for a channel whose device stopped reporting days ago — which is
# exactly what happened to the soil-moisture sensors (plans/14, finding 0).
# `homeassistant_last_updated_time_seconds` carries HA's own last_updated unix
# timestamp and is the only device-side liveness signal on /api/prometheus.
#
# It covers ~1300 entities on this instance, hence the entity filter. Values are
# **regexes** matched against the `entity` label (not literals — they are not
# escaped). Empty list disables it and restores the plain keep-only scrape.
#
# Caveat worth knowing before trusting the number: last_updated moves when the
# state *or its attributes* change, not on every report. So the derived age is
# "time since this value last moved", which cannot distinguish a healthy sensor
# reporting an unchanged value from one that stopped reporting. Comparing two
# channels on the same device (moisture vs temperature) is what disambiguates —
# see the staleness table in the plant-moisture dashboard.
#
# The alpstuga air-quality device is covered on all its channels, not just the
# CO2/PM2.5 ones: comparing a lively channel (CO2 moves continuously) against a
# quiet one (PM2.5 can sit at the same value for hours) is what distinguishes a
# healthy sensor from a stopped one. See plans/16-air-quality-co2-pm25.md.
victoria_metrics_ha_keep_last_updated_entities:
  - "sensor\\.pflanze.*"
  - "number\\.pflanze.*"
  - "sensor\\.buro_sabrina_tim_alpstuga.*"

# Enrich the kept HA sensor series with a `location` label (HA area) and an
# `integration` label (the entity's config-entry domain), generated from HA at
# deploy time via /api/template. Sensors with no HA area get location=unassigned.
# Requires an HA version with config_entry_id()/config_entry_attr() (verified on
# the emu HA). Set false to fall back to the plain keep-only scrape.
victoria_metrics_ha_enrich_labels: true
# HA-side Jinja rendered server-side by /api/template. Emits a JSON array of
# [entity, area, integration] triples (area/integration are null when HA has none).
# JSON avoids any delimiter/newline/quoting fragility on the Ansible side — it is
# parsed back with from_json. MUST stay wrapped in {% raw %} so Ansible does not
# evaluate the HA constructs (states.sensor, area_name, config_entry_attr) itself.
# Only covers states.sensor, so the kept `number` entities (soil_moisture_offset)
# stay unlabelled — select those by `entity` regex, not by location.
victoria_metrics_ha_label_template: >-
  {% raw %}
  {%- set ns = namespace(rows=[]) -%}
  {%- for s in states.sensor -%}
  {%- if state_attr(s.entity_id, 'device_class') in ['temperature', 'humidity', 'moisture', 'battery', 'power', 'energy', 'carbon_dioxide', 'pm25'] -%}
  {%- set ns.rows = ns.rows + [[s.entity_id, area_name(s.entity_id), config_entry_attr(config_entry_id(s.entity_id), 'domain')]] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.rows | tojson }}
  {% endraw %}
