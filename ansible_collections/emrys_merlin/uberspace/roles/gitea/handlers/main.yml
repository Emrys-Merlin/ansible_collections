- name: Migrate database
  ansible.builtin.shell:
    cmd: "${HOME}/bin/gitea -c ${HOME}/etc/gitea/app.ini migrate"

- name: Reread gitea service
  community.general.supervisorctl:
    name: gitea
    state: present

- name: Restart gitea service
  community.general.supervisorctl:
    name: gitea
    state: restarted
