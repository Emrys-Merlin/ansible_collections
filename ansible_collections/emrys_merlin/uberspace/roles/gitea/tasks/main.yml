# Driven through the mysql client rather than community.mysql, which needs
# PyMySQL importable from whichever interpreter Ansible discovers. On this host
# that is /usr/bin/python3.14 and only /usr/bin/python3 (3.6) carries PyMySQL, so
# this task failed and took the whole uberspace playbook down with it. Pinning
# ansible_python_interpreter to 3.6 and pip-installing PyMySQL into 3.14 are both
# worse; see plans/22-forgejo-tailnet.md, part A.
#
# No credentials are passed at all — uberspace preconfigures ~/.my.cnf (0600)
# with the account's user and password. gitea_db_password is still needed by
# app.ini, where gitea itself connects.
#
# check_mode: false because the query changes nothing, and without it a --check
# run skips the task, leaves .stdout undefined and dies in the `when` below.
- name: Check if the gitea database exists
  ansible.builtin.command:
    argv:
      - mysql
      - --batch
      - --skip-column-names
      - -e
      - "SHOW DATABASES LIKE '{{ gitea_db_name }}'"
  register: gitea_db_check
  changed_when: false
  check_mode: false

# Guarded on the check above rather than using CREATE DATABASE IF NOT EXISTS,
# which reports changed on every run.
- name: Create the gitea database
  ansible.builtin.command:
    argv:
      - mysql
      - -e
      - "CREATE DATABASE `{{ gitea_db_name }}`"
  when: gitea_db_name not in gitea_db_check.stdout

- name: Check if {{ gitea_flavour }} binary exists {{ gitea_version }}
  ansible.builtin.stat:
    path: "${HOME}/bin/gitea-{{ gitea_version }}"
  register: gitea_binary

# Named gitea-<version> whatever the flavour, so the ~/bin/gitea symlink and the
# supervisord program keep working across the forgejo switch. See gitea_flavour
# in defaults/main.yml.
- name: Download {{ gitea_flavour }} binary
  ansible.builtin.get_url:
    url: "{{ gitea_download_url }}"
    dest: "${HOME}/bin/gitea-{{ gitea_version }}"
    mode: "755"
  when: not gitea_binary.stat.exists
  notify:
    - Stop gitea service
    - Migrate database
    - Restart gitea service

- name: Link {{ gitea_flavour }} binary
  ansible.builtin.file:
    src: "${HOME}/bin/gitea-{{ gitea_version }}"
    dest: "${HOME}/bin/gitea"
    state: link
  # Also skipped under --check, because the download above did not really
  # happen there and `state: link` refuses to point at a file that does not
  # exist. Without this, a version bump cannot be dry-run at all — it dies here.
  # Giving it check_mode: false instead would be worse: that really would create
  # a symlink to a nonexistent binary during a dry run.
  when:
    - not gitea_binary.stat.exists
    - not ansible_check_mode

- name: Create gitea config directory
  ansible.builtin.file:
    path: "${HOME}/etc/gitea"
    state: directory
    mode: "755"

# The onepassword lookup returns "" for a missing or empty field rather than
# failing, so without this an unfilled item would be written straight into
# app.ini and break the running instance at the next restart.
- name: Assert the gitea secrets are set
  ansible.builtin.assert:
    that:
      - gitea_db_password | default('') | length > 0
      - gitea_secret_key | default('') | length > 0
    fail_msg: >-
      gitea_db_password or gitea_secret_key is empty. Both come from 1Password
      (items `gitea_db_password` and `gitea_secret_key`, field `password`).
      The values themselves are deliberately not shown.
    quiet: true
  no_log: true

# app.ini is deliberately NOT templated wholesale, and must not go back to
# being. Gitea writes generated state back into this file, and a template task
# destroys it silently. On this host that is WORK_PATH, [server] LFS_JWT_SECRET,
# [security] INTERNAL_TOKEN and [oauth2] JWT_SECRET — regenerating those breaks
# LFS auth, gitea's internal API, and every issued OAuth2 token respectively.
# ini_file touches only the options named below and leaves the rest alone.
#
# The old template also declared mode 644 on a file holding four secrets. The
# live file is 600, so a run would have loosened it; hence 0600 here.
#
# The `; ...` comments that used to sit on these lines have moved into this file
# instead. Gitea rewrites app.ini and relocates inline comments onto their own
# line, so the role could never have kept them stable anyway.
- name: Configure gitea
  community.general.ini_file:
    path: "${HOME}/etc/gitea/app.ini"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0600"
  loop:
    # Pinned, not defaulted. Upstream's default for this is
    # "<APP_DATA_PATH>/<flavour>-repositories", so the gitea -> forgejo switch
    # silently moved it from gitea-repositories to forgejo-repositories, a
    # directory that does not exist — the web UI still came up but every repo
    # API call returned 500 "no such file or directory". Naming it here makes
    # the location this role's decision instead of the upstream binary's.
    - { section: repository, option: ROOT, value: "/home/{{ ansible_user }}/var/gitea/gitea-repositories" }
    - { section: server, option: DOMAIN, value: "{{ ansible_user }}.uber.space" }
    - { section: server, option: ROOT_URL, value: "https://%(DOMAIN)s{{ gitea_url_path }}" }
    # Privacy: no gravatar or CDN fetches off this box.
    - { section: server, option: OFFLINE_MODE, value: "true" }
    - { section: server, option: LFS_START_SERVER, value: "true" }
    - { section: server, option: HTTP_PORT, value: "{{ gitea_port }}" }
    - { section: server, option: APP_DATA_PATH, value: "/home/{{ ansible_user }}/var/gitea" }
    # Forgejo v14+ validates ~/.ssh/authorized_keys at startup and REFUSES TO
    # START if it finds entries it did not write. On shared hosting that file is
    # also the account's own login path: here 7 of its 9 keys are the owner's,
    # and only 2 carry gitea's forced command. Upstream's other remedy — delete
    # the file and let it be regenerated — would lock the owner out of the host,
    # so it is not an option. Upstream calls this setting a temporary
    # workaround; on uberspace it is the permanent correct answer.
    #
    # DISABLE_SSH would also silence the check, but gitea manages two real keys
    # here, so turning SSH off is not the same no-op.
    - { section: server, option: SSH_ALLOW_UNEXPECTED_AUTHORIZED_KEYS, value: "true" }
    - { section: database, option: DB_TYPE, value: mysql }
    # Named for the same reason as [repository] ROOT above: it used to be left
    # to the built-in default and forgejo v15 stopped supplying one, failing
    # with "no database host defined" mid-migration. Matches roles/uptime_kuma,
    # which has always set 127.0.0.1:3306 explicitly on this host.
    - { section: database, option: HOST, value: "127.0.0.1:3306" }
    - { section: database, option: NAME, value: "{{ gitea_db_name }}" }
    - { section: database, option: USER, value: "{{ ansible_user }}" }
    - { section: security, option: INSTALL_LOCK, value: "true" }
    - { section: security, option: MIN_PASSWORD_LENGTH, value: "8" }
    # Length over character classes: memorable but still secure passwords.
    - { section: security, option: PASSWORD_COMPLEXITY, value: lower }
    # Only admins create users.
    - { section: service, option: DISABLE_REGISTRATION, value: "true" }
    - { section: service, option: SHOW_REGISTRATION_BUTTON, value: "false" }
    - { section: service, option: REGISTER_EMAIL_CONFIRM, value: "true" }
    # One of public, limited, private.
    - { section: service, option: DEFAULT_ORG_VISIBILITY, value: private }
    - { section: service, option: DEFAULT_KEEP_EMAIL_PRIVATE, value: "true" }
    - { section: service, option: NO_REPLY_ADDRESS, value: "noreply.{{ ansible_user }}.uber.space" }
    - { section: mailer, option: ENABLED, value: "true" }
    - { section: mailer, option: MAILER_TYPE, value: sendmail }
    - { section: mailer, option: FROM, value: "{{ ansible_user }}@uber.space" }
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"
  notify:
    - Restart gitea service

# Split out of the loop above purely so no_log can cover these two without
# blanking the task list for the twenty settings that are not secret.
- name: Configure gitea secrets
  community.general.ini_file:
    path: "${HOME}/etc/gitea/app.ini"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0600"
  loop:
    - { section: database, option: PASSWD, value: "{{ gitea_db_password }}" }
    - { section: security, option: SECRET_KEY, value: "{{ gitea_secret_key }}" }
  no_log: true
  notify:
    - Restart gitea service

- name: Create gitea data directory
  ansible.builtin.file:
    path: "${HOME}/var/gitea"
    state: directory
    mode: "755"

- name: Copy supervisorctl config
  ansible.builtin.template:
    src: templates/gitea.ini.j2
    dest: "${HOME}/etc/services.d/gitea.ini"
    mode: "644"
  notify:
    - Reread gitea service
    - Restart gitea service

# Everything below probes a *running, migrated* gitea, so the handlers have to
# have run by here rather than at the end of the play. On a version bump the
# symlink swap above has already repointed ${HOME}/bin/gitea at the new binary,
# so without this flush "Check admin user" would run the new binary against a
# database that has not been migrated yet — and on a rc of 1 the task after it
# would go on to try creating an admin user in it.
- name: Apply the binary swap and migration before probing
  ansible.builtin.meta: flush_handlers

# check_mode: false on both read-only probes below. They change nothing, and
# without it --check skips them, leaves .status / .rc unset, and the `when` on
# the task after each one dies on a healthy host. Same fix as 636330a made to
# the tailscale role.
- name: Check if gitea is reachable
  ansible.builtin.uri:
    url: "{{ gitea_url }}"
    method: HEAD
  register: uri_test
  changed_when: false
  check_mode: false
  failed_when: uri_test.status is undefined or uri_test.status <= 0

- name: Start web backend
  ansible.builtin.shell:
    cmd: "uberspace web backend set {{ gitea_url_path }} --http --remove-prefix --port {{ gitea_port }}"
  when: uri_test.status > 400

- name: Check admin user
  ansible.builtin.shell:
    cmd: "${HOME}/bin/gitea -c ${HOME}/etc/gitea/app.ini admin user list | grep {{ gitea_admin_user }}"
    chdir: "${HOME}/var/gitea"
  register: admin_test
  changed_when: false
  check_mode: false
  failed_when: admin_test.rc > 1

- name: Create admin user
  ansible.builtin.shell:
    cmd: '${HOME}/bin/gitea -c ${HOME}/etc/gitea/app.ini admin user create --username {{ gitea_admin_user }} --password "{{ gitea_admin_password }}" --email {{ ansible_user }}@uber.space --admin'
    chdir: "${HOME}/var/gitea"
  when: admin_test.rc > 0
