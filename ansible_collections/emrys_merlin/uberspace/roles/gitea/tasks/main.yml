# Driven through the mysql client rather than community.mysql, which needs
# PyMySQL importable from whichever interpreter Ansible discovers. On this host
# that is /usr/bin/python3.14 and only /usr/bin/python3 (3.6) carries PyMySQL, so
# this task failed and took the whole uberspace playbook down with it. Pinning
# ansible_python_interpreter to 3.6 and pip-installing PyMySQL into 3.14 are both
# worse; see plans/22-forgejo-tailnet.md, part A.
#
# No credentials are passed at all — uberspace preconfigures ~/.my.cnf (0600)
# with the account's user and password. gitea_db_password is still needed by
# app.ini, where gitea itself connects.
#
# check_mode: false because the query changes nothing, and without it a --check
# run skips the task, leaves .stdout undefined and dies in the `when` below.
- name: Check if the gitea database exists
  ansible.builtin.command:
    argv:
      - mysql
      - --batch
      - --skip-column-names
      - -e
      - "SHOW DATABASES LIKE '{{ gitea_db_name }}'"
  register: gitea_db_check
  changed_when: false
  check_mode: false

# Guarded on the check above rather than using CREATE DATABASE IF NOT EXISTS,
# which reports changed on every run.
- name: Create the gitea database
  ansible.builtin.command:
    argv:
      - mysql
      - -e
      - "CREATE DATABASE `{{ gitea_db_name }}`"
  when: gitea_db_name not in gitea_db_check.stdout

- name: Check if gitea binary exists {{ gitea_version }}
  ansible.builtin.stat:
    path: "${HOME}/bin/gitea-{{ gitea_version }}"
  register: gitea_binary

- name: Download gitea binary
  ansible.builtin.get_url:
    url: "https://github.com/go-gitea/gitea/releases/download/v{{ gitea_version }}/gitea-{{ gitea_version }}-linux-amd64"
    dest: "${HOME}/bin/gitea-{{ gitea_version }}"
    mode: "755"
  when: not gitea_binary.stat.exists
  notify:
    - Migrate database
    - Restart gitea service

- name: Link gitea binary
  ansible.builtin.file:
    src: "${HOME}/bin/gitea-{{ gitea_version }}"
    dest: "${HOME}/bin/gitea"
    state: link
  when: not gitea_binary.stat.exists

- name: Create gitea config directory
  ansible.builtin.file:
    path: "${HOME}/etc/gitea"
    state: directory
    mode: "755"

- name: Copy config template
  ansible.builtin.template:
    src: templates/app.ini.j2
    dest: "${HOME}/etc/gitea/app.ini"
    mode: "644"
  notify:
    - Restart gitea service

- name: Create gitea data directory
  ansible.builtin.file:
    path: "${HOME}/var/gitea"
    state: directory
    mode: "755"

- name: Copy supervisorctl config
  ansible.builtin.template:
    src: templates/gitea.ini.j2
    dest: "${HOME}/etc/services.d/gitea.ini"
    mode: "644"
  notify:
    - Reread gitea service
    - Restart gitea service

- name: Check if gitea is reachable
  ansible.builtin.uri:
    url: "{{ gitea_url }}"
    method: HEAD
  register: uri_test
  failed_when: uri_test.status is undefined or uri_test.status <= 0

- name: Start web backend
  ansible.builtin.shell:
    cmd: "uberspace web backend set {{ gitea_url_path }} --http --remove-prefix --port {{ gitea_port }}"
  when: uri_test.status > 400

- name: Check admin user
  ansible.builtin.shell:
    cmd: "${HOME}/bin/gitea -c ${HOME}/etc/gitea/app.ini admin user list | grep {{ gitea_admin_user }}"
    chdir: "${HOME}/var/gitea"
  register: admin_test
  failed_when: admin_test.rc > 1

- name: Create admin user
  ansible.builtin.shell:
    cmd: '${HOME}/bin/gitea -c ${HOME}/etc/gitea/app.ini admin user create --username {{ gitea_admin_user }} --password "{{ gitea_admin_password }}" --email {{ ansible_user }}@uber.space --admin'
    chdir: "${HOME}/var/gitea"
  when: admin_test.rc > 0
