gitea_db_name: "{{ ansible_user }}_gitea"
gitea_port: 3001

# The path gitea used to be served on publicly. The role now ensures no
# `uberspace web backend` exists for it — this is the thing to *remove*, not the
# place to reach gitea. See gitea_root_url in defaults/main.yml for that, and
# plans/22-forgejo-tailnet.md part C for why.
gitea_web_backend_path: "/gitea"
