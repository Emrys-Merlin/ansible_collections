---
# defaults file for roles/gitea

# Which upstream the binary comes from. Forgejo is a hard fork of gitea and is a
# drop-in replacement: it reads the same `app.ini`, honours the `GITEA_*` paths,
# and its `migrate` subcommand is the same one. So only the download URL differs
# and everything else in this role — the `~/bin/gitea` symlink, the supervisord
# program name, `~/etc/gitea`, `~/var/gitea` — is deliberately left named
# `gitea`, to keep the migration from moving files and rewriting the database at
# the same time.
#
# The migration path is one-way and narrow: Forgejo v10 is the last release that
# accepts a gitea database, and it only accepts one from gitea <= 1.22.x. So the
# route is gitea 1.22.x -> forgejo 10.0.x -> any later forgejo. Once a host is on
# forgejo it cannot go back — the schema records its version specifically to
# block a downgrade. See plans/22-forgejo-tailnet.md.
#
# These live in defaults rather than vars/ so the inventory can override them;
# role vars/ outranks inventory host vars and would win instead.
gitea_flavour: gitea

gitea_download_urls:
  gitea: "https://github.com/go-gitea/gitea/releases/download/v{{ gitea_version }}/gitea-{{ gitea_version }}-linux-amd64"
  forgejo: "https://codeberg.org/forgejo/forgejo/releases/download/v{{ gitea_version }}/forgejo-{{ gitea_version }}-linux-amd64"

gitea_download_url: "{{ gitea_download_urls[gitea_flavour] }}"

# Bind localhost only. This is reachable from the tailnet because userspace
# tailscaled forwards inbound connections to 127.0.0.1 — measured on this host,
# not assumed: roles/uptime_kuma binds 127.0.0.1:3002 exactly this way and
# answers over the node's ts.net name from the control node.
#
# Do NOT set this to 0.0.0.0, and do not add an `uberspace web backend` for
# gitea. Either one puts a git host holding every private repository back on the
# public internet, which is the whole of plan 22 part C undone.
gitea_host: "127.0.0.1"

# The address a *client* uses, which is not gitea_host: gitea builds clone URLs,
# LFS endpoints and webhook payloads out of ROOT_URL, so it has to be the tailnet
# name. Set it per host — there is deliberately no working default here, because
# a public-looking fallback would silently undo part C on a host that forgot to
# set it. The role asserts on it instead.
gitea_root_url: ""
