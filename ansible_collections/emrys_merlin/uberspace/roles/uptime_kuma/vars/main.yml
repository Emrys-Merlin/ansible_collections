---
# vars file for collections/ansible_collections/emrys_merlin/uberspace/roles/uptime_kuma
#
# Supervisord does not expand `~` — a bare tilde in a .ini ends up as a directory
# literally named `~` on the host (there is one already, left by an early version
# of the prometheus role). `%(ENV_HOME)s` is the only thing it understands, so the
# `~`-prefixed paths from defaults/main.yml are rewritten here for template use.
# Kept in vars/ rather than defaults/ so they cannot drift out of sync with the
# paths the Ansible modules actually use.
uptime_kuma_link_dir_sv: "{{ uptime_kuma_link_dir | regex_replace('^~', '%(ENV_HOME)s') }}"
uptime_kuma_data_dir_sv: "{{ uptime_kuma_data_dir | regex_replace('^~', '%(ENV_HOME)s') }}"

# Marker written once `npm ci` and the dist unpack have both succeeded. Guards
# the expensive steps, so a re-run is a no-op and a version bump is a var change.
# Deliberately not just "does the directory exist": an interrupted install would
# leave the directory there with no node_modules.
uptime_kuma_install_marker: "{{ uptime_kuma_install_dir }}/.ansible-install-complete"
